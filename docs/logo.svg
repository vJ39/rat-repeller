<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <style>
      .glow { filter: drop-shadow(0 0 6px #39ff6a); }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    </style>
  </defs>
  <rect width="900" height="300" fill="#050805"/>

  <g class="glow" stroke="#39ff6a" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- 音波(左) -->
    <path d="M40,150 a70,70 0 0 1 0,-1" stroke-dasharray="10 8"/>
    <path d="M65,110 a90,90 0 0 1 0,80" stroke-dasharray="10 8"/>
    <path d="M95,90 a115,115 0 0 1 0,120" stroke-dasharray="10 8"/>

    <!-- ねずみの顔 -->
    <path d="M170,120 l25,-35 l15,25" stroke-dasharray="8 6"/>
    <path d="M280,120 l-25,-35 l-15,25" stroke-dasharray="8 6"/>
    <ellipse cx="225" cy="165" rx="70" ry="60" stroke-dasharray="8 6"/>
    <circle cx="200" cy="150" r="5" fill="#39ff6a" stroke="none"/>
    <circle cx="250" cy="150" r="5" fill="#39ff6a" stroke="none"/>
    <path d="M215,185 q10,10 20,0" stroke-dasharray="6 5"/>
    <path d="M180,195 l-35,-5 M180,205 l-35,10 M270,195 l35,-5 M270,205 l35,10" stroke-dasharray="6 5"/>

    <!-- 音波(右) -->
    <path d="M330,90 a115,115 0 0 1 0,120" stroke-dasharray="10 8"/>
    <path d="M360,110 a90,90 0 0 1 0,80" stroke-dasharray="10 8"/>
    <path d="M385,149 a70,70 0 0 1 0,1" stroke-dasharray="10 8"/>
  </g>

  <text x="460" y="175" class="mono glow" font-size="76" font-weight="bold" fill="#39ff6a">rat-repeller</text>
  <text x="462" y="220" class="mono" font-size="30" fill="#a9b8c9">High-frequency sound. Peace of mind.</text>
</svg>
